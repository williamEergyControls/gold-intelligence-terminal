<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23d99a16%22/%3E%3C/svg%3E">
<title>Search · Gold Intelligence Terminal</title>
<link rel="stylesheet" href="/css/terminal.css">
<style>
.swrap{max-width:760px;margin:0 auto;padding:32px 24px}
.sbar{display:flex;gap:8px;margin:8px 0 20px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:var(--shadow)}
.sbar:focus-within{border-color:var(--blue)}
.sbar input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font:400 16px var(--sans);outline:none}
.sbar button{font:500 14px var(--sans);color:#fff;background:var(--blue);border-radius:999px;padding:10px 20px}
body:not(.day) .sbar button{color:#062e6f}
.sresult{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 18px;margin-bottom:10px;display:block;text-decoration:none!important}
.sresult:hover{border-color:var(--blue)}
.sresult .rt{font:400 12.5px var(--sans);color:var(--dim)}
.sresult .rh{font:500 16px var(--sans);color:var(--blue);margin-top:2px}
.sresult .rs{font:400 13.5px var(--sans);color:var(--mut);margin-top:3px}
.shint{font:400 13px var(--sans);color:var(--dim);text-align:center;margin-top:24px}
</style>
</head>
<body data-page="search">
<script src="/js/shell.js"></script>
<main>
<div class="swrap">
  <div class="pagehead"><div><h1>Search</h1><p>Desks, data series and headlines from your sources.</p></div></div>
  <form class="sbar" id="sform" role="search">
    <input id="sq" type="search" placeholder="Try gold, real yield, Suez, drought" autocomplete="off" autofocus aria-label="Search">
    <button id="sgo" type="submit">Search</button>
  </form>
  <div id="sresults"><div class="shint">Type at least two characters.</div></div>
</div>
</main>
<script>
(function () {
  var G = window.GT, esc = G.esc, sq = document.getElementById('sq'), out = document.getElementById('sresults'), t = null;
  var KIND = { PAGE: 'Desk', NEWS: 'News', DATA: 'Data' };
  function search() {
    var q = sq.value.trim();
    if (q.length < 2) { out.innerHTML = '<div class="shint">Type at least two characters.</div>'; return; }
    out.innerHTML = '<div class="shint">Searching…</div>';
    G.getJSON('/api/search?q=' + encodeURIComponent(q)).then(function (d) {
      var R = (d && d.results) || [];
      if (!R.length) { out.innerHTML = '<div class="shint">Nothing found for “' + esc(q) + '”.</div>'; return; }
      out.innerHTML = R.map(function (r) {
        var ext = r.type === 'NEWS' && r.url && r.url !== '#';
        var href = ext ? G.safeUrl(r.url) : (/^\/[a-z]/.test(r.url || '') ? r.url : '#');
        return '<a class="sresult" href="' + esc(href) + '"' + (ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '><span class="rt">' + (KIND[r.type] || 'Result') + '</span><div class="rh">' + esc(r.title) + '</div><div class="rs">' + esc(r.source || '') + '</div></a>';
      }).join('');
    }).catch(function () { out.innerHTML = '<div class="shint">Search is unavailable right now. Try again in a moment.</div>'; });
  }
  sq.addEventListener('input', function () { clearTimeout(t); t = setTimeout(search, 300); });
  document.getElementById('sform').addEventListener('submit', function (e) { e.preventDefault(); search(); });
  var q0 = new URLSearchParams(location.search).get('q'); if (q0) { sq.value = q0; search(); }
})();
</script>
</body>
</html>
