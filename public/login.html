<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23d99a16%22/%3E%3C/svg%3E">
<title>Sign in · Gold Intelligence Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/terminal.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px 16px}
.lbox{width:420px;max-width:100%}
.lhead{text-align:center;margin-bottom:24px}
.lhead .lx{width:40px;height:40px;border-radius:12px;display:inline-block;margin-bottom:14px;background:linear-gradient(135deg,#f6d36b 0%,#d99a16 55%,#a86a05 100%)}
.lhead h1{font:500 24px var(--sans);letter-spacing:-.01em;color:var(--txt)}
.lhead p{font:400 14px var(--sans);color:var(--mut);margin-top:6px}
.lbox .panel{padding:8px 8px 4px}
.lfield{margin-bottom:14px}
.lfield label{display:block;font:500 13px var(--sans);color:var(--mut);margin-bottom:6px}
.lfield input{width:100%;background:var(--panel3);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:400 15px var(--sans);padding:11px 14px;outline:none}
.lfield input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blueBg)}
.lbtn{margin-top:6px;background:var(--blue)!important;color:#fff!important}
body:not(.day) .lbtn{color:#062e6f!important}
.lerr{font:400 13.5px var(--sans);color:var(--dn);margin-top:12px;text-align:center;min-height:18px}
.lok{font:400 13.5px var(--sans);color:var(--up);margin-top:4px;text-align:center;min-height:18px}
.lnote{font:400 12.5px/1.6 var(--sans);color:var(--dim);margin-top:14px;text-align:center;border-top:1px solid var(--line2);padding-top:14px}
.lmode{display:flex;background:var(--panel2);border-radius:999px;padding:3px;margin-bottom:18px}
.lmode button{flex:1;font:500 14px var(--sans);padding:8px 0;color:var(--mut);border-radius:999px}
.lmode button.on{color:var(--txt);background:var(--panel);box-shadow:var(--shadow)}
</style>
</head>
<body data-page="login">
<script src="/js/shell.js"></script>
<div class="lbox">
  <div class="lhead">
    <span class="lx"></span>
    <h1>Gold Intelligence Terminal</h1>
    <p>Sign in to your markets desk</p>
  </div>
  <div class="panel">
    <div class="p-hd"><span class="ttl" id="formTitle">Sign in</span></div>
    <div class="p-bd">
      <div class="lmode">
        <button id="modeLogin" class="on">Sign in</button>
        <button id="modeReg">Sign up</button>
      </div>
      <div class="lfield"><label>Operator name</label><input id="lname" maxlength="24" autocomplete="username"></div>
      <div class="lfield"><label id="plabel">Password</label><input id="lpass" type="password" maxlength="128" autocomplete="current-password"></div>
      <div class="lfield" id="pass2row" style="display:none"><label>Confirm password</label><input id="lpass2" type="password" maxlength="128" autocomplete="new-password"></div>
      <button class="runbtn lbtn" id="lgo">Sign in</button>
      <div class="lerr" id="lerr"></div>
      <div class="lok" id="lok"></div>
      <div class="lnote">Passwords are hashed with PBKDF2-SHA256. Sessions last 7 days and failed attempts are rate limited.<br>Research tool, not financial advice.</div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var mode = 'login';
var name = document.getElementById('lname');
var pass = document.getElementById('lpass');
var pass2 = document.getElementById('lpass2');
var pass2row = document.getElementById('pass2row');
var err = document.getElementById('lerr');
var ok = document.getElementById('lok');
var btn = document.getElementById('lgo');
var bLogin = document.getElementById('modeLogin');
var bReg = document.getElementById('modeReg');
var formTitle = document.getElementById('formTitle');
var plabel = document.getElementById('plabel');

/* check existing session via API */
var tok = localStorage.getItem('git-token');
if (tok) {
  fetch('/api/auth/me', { headers: { 'x-session': tok } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.valid === true) {
        location.replace('/');
      } else {
        localStorage.removeItem('git-token');
        localStorage.removeItem('git-name');
      }
    })
    .catch(function(){ });
}

function setMode(m){
  mode = m;
  bLogin.classList.toggle('on', m === 'login');
  bReg.classList.toggle('on', m === 'reg');
  formTitle.textContent = m === 'login' ? 'Sign in' : 'Create account';
  btn.textContent = m === 'login' ? 'Sign in' : 'Create account';
  pass2row.style.display = m === 'reg' ? '' : 'none';
  plabel.textContent = m === 'reg' ? 'Password (6+ chars)' : 'Password';
  err.textContent = ''; ok.textContent = '';
}
bLogin.addEventListener('click', function(){ setMode('login'); });
bReg.addEventListener('click', function(){ setMode('reg'); });

function show(txt, isOk){
  if(isOk){ ok.textContent = txt; err.textContent = ''; }
  else{ err.textContent = txt; ok.textContent = ''; }
}

function submit(){
  var n = name.value.trim();
  var p = pass.value;
  if(n.length < 2){ show('Enter operator name (2+ chars)'); return; }
  if(!p){ show('Enter password'); return; }
  if(mode === 'reg'){
    if(p.length < 6){ show('Password must be 6+ characters'); return; }
    if(p !== pass2.value){ show('Passwords do not match'); return; }
  }
  btn.disabled = true; btn.textContent = mode === 'login' ? 'Verifying...' : 'Creating...';
  show('', true);
  fetch(mode === 'login' ? '/api/auth/login' : '/api/auth/register', {
    method: 'Post',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name: n, password: p })
  })
  .then(function(r){ return r.json().then(function(d){ return { status: r.status, data: d }; }); })
  .then(function(res){
    btn.disabled = false; btn.textContent = mode === 'login' ? 'Sign in' : 'Create account';
    if(res.data && res.data.ok && res.data.token){
      localStorage.setItem('git-token', res.data.token);
      localStorage.setItem('git-name', res.data.name || n);
      localStorage.setItem('git-role', res.data.role || 'operator');
      if (res.data.tier) localStorage.setItem('git-tier', res.data.tier); else localStorage.removeItem('git-tier');
      show('Access granted - redirecting...', true);
      setTimeout(function(){ location.href = '/'; }, 600);
    } else {
      show(res.data && res.data.error ? res.data.error : 'Authentication failed');
    }
  })
  .catch(function(e){
    btn.disabled = false; btn.textContent = mode === 'login' ? 'Sign in' : 'Create account';
    show('Connection error - ' + String(e && e.message || e));
  });
}
btn.addEventListener('click', submit);
pass.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
pass2.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
name.addEventListener('keydown', function(e){ if(e.key === 'Enter') pass.focus(); });
})();
</script>
</body>
</html>
